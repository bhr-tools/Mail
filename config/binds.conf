# --- Keybindings (aerc) ---
# Same reflexes as Get Done and yazi: j/k to browse, l to open, h to go back,
# d for done (archive), Space to select, ? for the cheatsheet.
# This file replaces aerc's defaults entirely. The sections that depend on
# each account's folders (drafts, trash) are generated by hm-module.nix.

<C-n> = :next-tab<Enter>
<C-p> = :prev-tab<Enter>
<C-t> = :term<Enter>
? = :help keys<Enter>
<C-q> = :prompt 'Quit?' quit<Enter>
<C-z> = :suspend<Enter>

# Accounts (AZERTY digits, like the tabs in yazi).
& = :change-tab 0<Enter>
é = :change-tab 1<Enter>
'"' = :change-tab 2<Enter>


[messages]
q = :prompt 'Quit?' quit<Enter>

# --- Browsing ---
j = :next<Enter>
<Down> = :next<Enter>
k = :prev<Enter>
<Up> = :prev<Enter>
<C-d> = :next 50%<Enter>
<C-u> = :prev 50%<Enter>
gg = :select 0<Enter>
G = :select -1<Enter>
zz = :align center<Enter>

# Folders: J/K to step through them, gi back to the inbox, gf to pick one.
J = :next-folder<Enter>
K = :prev-folder<Enter>
gi = :cf INBOX<Enter>
gf = :cf<space>

l = :view<Enter>
e = :view<Enter>
<Enter> = :view<Enter>

# --- Threads ---
T = :toggle-threads<Enter>
<tab> = :fold -t<Enter>
zM = :fold -a<Enter>
zR = :unfold -a<Enter>

# --- Selection ---
<Space> = :mark -t<Enter>:next<Enter>
V = :mark -v<Enter>
<Esc> = :unmark -a<Enter>:clear<Enter>

# --- Actions ---
# Done: out of the inbox (archived, never deleted).
d = :archive flat<Enter>
m = :move<space>
u = :read -t<Enter>
s = :flag -t<Enter>

c = :compose<Enter>
r = :reply -q<Enter>
R = :reply -aq<Enter>
f = :forward<Enter>

# --- Search ---
/ = :search<space>
\ = :filter<space>
n = :next-result<Enter>
N = :prev-result<Enter>

| = :pipe<space>


[view]
q = :close<Enter>
h = :close<Enter>
<Esc> = :close<Enter>

# Next / previous message without going back to the list.
J = :next<Enter>
K = :prev<Enter>

d = :archive flat<Enter>
m = :move<space>
u = :read -t<Enter>
s = :flag -t<Enter>

r = :reply -q<Enter>
R = :reply -aq<Enter>
f = :forward<Enter>

# Links and attachments open with the default applications (xdg-open).
gx = :open-link <space>
yy = :copy-link <space>
o = :open<Enter>
S = :save<space>
H = :toggle-headers<Enter>
<C-j> = :next-part<Enter>
<C-k> = :prev-part<Enter>

| = :pipe<space>
/ = :toggle-key-passthrough<Enter>/

[view::passthrough]
$noinherit = true
$ex = <C-x>
<Esc> = :toggle-key-passthrough<Enter>


[compose]
# The editor (nvim) is not focused: move between the headers and the body.
$noinherit = true
$ex = <C-x>
$complete = <C-o>
<C-j> = :next-field<Enter>
<C-k> = :prev-field<Enter>
<tab> = :next-field<Enter>
<backtab> = :prev-field<Enter>
<C-n> = :next-tab<Enter>
<C-p> = :prev-tab<Enter>

[compose::editor]
$noinherit = true
$ex = <C-x>
<C-j> = :next-field<Enter>
<C-k> = :prev-field<Enter>
<C-n> = :next-tab<Enter>
<C-p> = :prev-tab<Enter>

[compose::review]
y = :send<Enter> # Send
e = :edit<Enter> # Edit
a = :attach<space> # Attach a file
d = :detach<space> # Remove an attachment
v = :preview<Enter> # Preview
p = :postpone<Enter> # Save as draft
q = :choose -o d discard abort -o p postpone postpone<Enter> # Discard or save as draft


[terminal]
$noinherit = true
$ex = <C-x>
<C-n> = :next-tab<Enter>
<C-p> = :prev-tab<Enter>
